server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # All data is processed client-side; only same-origin sample files are fetched.
    client_max_body_size 2m;

    # NOTE: nginx drops inherited add_header directives in any location that
    # declares its own add_header. Keep cache policy on `expires` below so these
    # server-level security headers still apply everywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /samples/ {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
